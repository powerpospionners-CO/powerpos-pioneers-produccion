services:
  postgres:
    image: postgres:16
    container_name: powerpos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: powerpos
      POSTGRES_PASSWORD: powerpos123
      POSTGRES_DB: powerpos_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: powerpos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: