name: Validación PowerPOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pruebas
          POSTGRES_PASSWORD: solo_ci
          POSTGRES_DB: powerpos_pos_test
        ports: ['55439:5432']
        options: --health-cmd "pg_isready -U pruebas -d powerpos_pos_test" --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: solo_ci
          MARIADB_DATABASE: powerpos_pos_test
        ports: ['55440:3306']
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 15
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://pruebas:solo_ci@127.0.0.1:55439/powerpos_pos_test
      MYSQL_DATABASE_URL: mysql://root:solo_ci@127.0.0.1:55440/powerpos_pos_test
      JWT_SECRET: solo-ci-no-usar-en-produccion-powerpos
      BACKGROUND_JOBS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run test:operacion
      - run: node --test scripts/export-migracion-mysql.test.cjs scripts/import-migracion-mysql.test.cjs
      - run: node --test agente-impresion/diagnostico-red.test.cjs
      - run: npm run test:e2e -- --runInBand
      - run: npm run build
      - run: npx prisma db push --skip-generate
      - run: node test/pos-integracion.cjs
        env:
          POS_TEST_DATABASE_URL: postgresql://pruebas:solo_ci@127.0.0.1:55439/powerpos_pos_test
      - run: npm run build:mysql
      - run: npx prisma db push --schema prisma/mysql/schema.prisma --skip-generate
      - run: node test/pos-integracion.cjs
        env:
          POS_TEST_DATABASE_URL: mysql://root:solo_ci@127.0.0.1:55440/powerpos_pos_test
      - run: node scripts/probar-restauracion-mysql.cjs
        env:
          POS_TEST_DATABASE_URL: mysql://root:solo_ci@127.0.0.1:55440/powerpos_pos_test
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --test test/*.test.cjs tests/*.test.cjs scripts/*.test.cjs
      - run: npm run build
  escritorio:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run smoke
